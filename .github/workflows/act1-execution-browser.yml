name: Act I real-browser three Parashu execution proofs
on:
  pull_request:
    paths:
      - ".github/workflows/act1-execution-browser.yml"
      - "scripts/act1-execution-browser.mjs"
      - "components/game/KaliyugaArena.tsx"
      - "lib/game/act1ExecutionVisualPlan.ts"
      - "lib/game/rudra3dRenderer.ts"
      - "lib/game/boss3dRenderer.ts"
  workflow_dispatch:
concurrency:
  group: act1-execution-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout actual game and production media
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            app
            components
            lib
            engine
            hooks
            scripts
            public
            new 3D assets and animations
            cutscenes/assets
            audio and sound effects
            soundtracks
            package.json
            tsconfig.json
            next-env.d.ts
            next.config.ts
            postcss.config.mjs
            eslint.config.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install production dependencies and Playwright
        run: |
          npm install --ignore-scripts --no-fund --no-audit
          npm install --no-save playwright@1.56.1 --ignore-scripts --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Build and serve production Next.js app
        run: |
          npm run build
          nohup npm run start > /tmp/act1-execution-next.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 2
          done
          tail -n 130 /tmp/act1-execution-next.log
          exit 1
      - name: Execute three canonical F-key finishers on real staged targets
        run: |
          failed=0
          for variant in downward_crush spin_360_cleave impaling_lunge; do
            echo "::group::Execution rehearsal $variant"
            ACT1_QA_FINISHER="$variant" \
            ACT1_QA_OUTPUT="artifacts/act1-execution/$variant" \
            node scripts/act1-execution-browser.mjs || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Preserve exact execution active frame and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act1-three-execution-browser-proof
          path: artifacts/act1-execution/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve launch diagnostics
        if: always()
        run: tail -n 150 /tmp/act1-execution-next.log 2>/dev/null || true
