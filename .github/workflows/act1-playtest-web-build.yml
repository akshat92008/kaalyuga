name: Act I downloadable Apple Silicon Mac browser playtest build
on:
  pull_request:
    paths:
      - ".github/workflows/act1-playtest-web-build.yml"
  workflow_dispatch:
concurrency:
  group: act1-downloadable-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compile-playtest:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout production app code and compact built-in audio/UI media
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            components
            lib
            engine
            hooks
            public/kaalyuga
            package.json
            tsconfig.json
            next-env.d.ts
            next.config.ts
            postcss.config.mjs
            eslint.config.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile production Next.js standalone server
        run: |
          test "$(uname -m)" = "arm64"
          npm install --ignore-scripts --no-fund --no-audit
          npx tsc --noEmit --incremental false
          npm run build
      - name: Assemble an Apple Silicon Mac browser playtest bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bundle
          cp -a .next/standalone/. artifacts/bundle/
          mkdir -p artifacts/bundle/.next
          cp -a .next/static artifacts/bundle/.next/static
          if [ -d public/kaalyuga ]; then
            mkdir -p artifacts/bundle/public
            cp -a public/kaalyuga artifacts/bundle/public/kaalyuga
          fi
          test -f artifacts/bundle/server.js
          cat > artifacts/bundle/START_KALIYUGA.command <<'EOF'
          #!/bin/bash
          set -e
          cd "$(dirname "$0")"
          if ! command -v node >/dev/null 2>&1; then
            echo "Node.js 22 or newer is required. Install Node.js from https://nodejs.org/"
            read -r -p "Press Enter to close..."
            exit 1
          fi
          export PORT="${PORT:-3000}"
          echo "Kaliyuga Act I playtest: http://localhost:${PORT}"
          echo "Keep this Terminal window open while playing."
          echo "Internet is required to stream large game assets from the Kaliyuga repository."
          if command -v open >/dev/null 2>&1; then
            (sleep 2; open "http://localhost:${PORT}" >/dev/null 2>&1 || true) &
          fi
          node server.js
          EOF
          chmod +x artifacts/bundle/START_KALIYUGA.command
          cat > artifacts/bundle/README_PLAYTEST.txt <<'EOF'
          KALIYUGA — ACT I BROWSER PLAYTEST
          ===================================
          Built from GitHub PR #5 for development testing, not a final release.

          MAC (Apple Silicon M1/M2/M3/M4): With Node.js 22+ installed, open START_KALIYUGA.command.
               If macOS blocks a downloaded unsigned shell script, run in
               Terminal: bash START_KALIYUGA.command

          This build is compiled natively on macOS ARM64. It is not intended
          for Windows or Intel Macs.

          IMPORTANT:
          - Internet connection required: large FBX/texture/arena assets
            are requested on demand from the public GitHub repository.
          - First-time asset loading may take a while. This ZIP intentionally
            excludes several GB of source-grade media; it is NOT an offline installer.
          - No paid backend or account required to play.
          - This is an experimental Act I build. A macOS ARM64 CI launch
            smoke test is NOT a physical Mac M3 Air GPU performance benchmark.
          - To quit, close the Terminal or press Control-C.
          EOF
          echo "${GITHUB_SHA}" > artifacts/bundle/BUILD_COMMIT.txt
          du -sh artifacts/bundle
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          out=Path("artifacts/kaliyuga-act1-macos-arm64-playtest.zip")
          src=Path("artifacts/bundle")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for file in sorted(src.rglob("*")):
                  if file.is_file():
                      z.write(file,file.relative_to(src))
          print("BUILD ZIP",out, out.stat().st_size,"bytes")
          PY
      - name: Smoke-test standalone build without source repository
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/bundle
          PORT=3133 node server.js > ../playtest-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3133/ > /dev/null; then
              echo "PASS: Standalone browser game served HTTP 200 without source code."
              exit 0
            fi
            sleep 2
          done
          cat ../playtest-server.log
          exit 1
      - name: Upload downloadable playtest build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaliyuga-act1-macos-arm64-playtest-build
          path: |
            artifacts/kaliyuga-act1-macos-arm64-playtest.zip
            artifacts/playtest-server.log
          if-no-files-found: warn
          retention-days: 7
