name: Build Susanoo optimized GLBs
on:
  pull_request:
    paths:
      - ".github/workflows/build-susanoo-glbs.yml"
      - "scripts/build-optimized-glbs.py"
      - "scripts/optimized-asset-aliases.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-susanoo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Susanoo FBX and converter without full 4GB project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          sparse-checkout: |
            scripts
            public/optimized
            new 3D assets and animations/3D Models/Horned_Warlord_of_the_Abyss
          sparse-checkout-cone-mode: false
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          # Ubuntu 26.04's Blender 5 package may omit NumPy though its FBX addon requires it.
          sudo apt-get install -y blender python3-numpy
      - name: Convert both Susanoo FBX rigs to GLBs (preserving skeletons and clips)
        run: |
          blender -b --python scripts/build-optimized-glbs.py -- --contains Horned_Warlord_of_the_Abyss --strict
      - name: Confirm two GLBs were produced and indexed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("public/optimized/asset-manifest.json").read_text())
          source=[k for k in m if "Horned_Warlord_of_the_Abyss" in k]
          assert len(source) >= 2, m
          for k in source:
              f=Path("public")/m[k].lstrip("/")
              assert f.exists() and f.stat().st_size > 1024, k
          print("Validated Susanoo GLB files:", len(source))
          PY
      - name: Commit validated GLBs to the originating PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/optimized
          if git diff --cached --quiet; then
            echo "No optimized asset changes to commit"
          else
            git commit -m "Add validated Susanoo skinned GLB assets and manifest"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
      - name: Upload optimized models and URL mapping
        uses: actions/upload-artifact@v4
        with:
          name: susanoo-glbs-and-manifest
          path: public/optimized/
          retention-days: 7
