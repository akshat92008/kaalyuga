name: Meru production core — tests and TypeScript gate
on:
  push:
    branches:
      - feature/meru-cinematic-production-core-20261121
    paths:
      - 'engine/meru/**'
      - 'components/game/MeruCinematicStudio.tsx'
      - 'components/game/MeruCinematicPlayback.tsx'
      - 'components/game/MeruPortalTravel.tsx'
      - 'components/game/KaliyugaArena.tsx'
      - 'app/meru-studio/**'
      - 'lib/game/chamberGeometry.ts'
      - 'tsconfig.meru.json'
      - '.github/workflows/meru-production-core.yml'
  pull_request:
    paths:
      - 'engine/meru/**'
      - 'components/game/MeruCinematicStudio.tsx'
      - 'components/game/MeruCinematicPlayback.tsx'
      - 'components/game/MeruPortalTravel.tsx'
      - 'components/game/KaliyugaArena.tsx'
      - 'app/meru-studio/**'
      - 'lib/game/chamberGeometry.ts'
      - 'tsconfig.meru.json'
      - '.github/workflows/meru-production-core.yml'
permissions:
  contents: read
concurrency:
  group: meru-production-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  meru:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine/meru
            scripts/meru/install-scenes.ts
            components
            app
            lib
            engine/ue5GraphicsEngine.ts
            engine/lanternShaderEngine.ts
            engine/v7StoryEngine.ts
            package.json
            tsconfig.json
            tsconfig.meru.json
            next.config.ts
            next-env.d.ts
            postcss.config.mjs
            .eslintrc.json
            tailwind.config.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run cinematic, quality, and portal regression tests
        run: npx tsx --test engine/meru/meruCore.test.ts
      - name: Verify compiled production cinematic scene manifest
        run: npm run meru:verify-scenes
      - name: Strictly type-check new Meru modules and integrations
        run: npx tsc --noEmit --pretty false -p tsconfig.meru.json
      - name: Audit pre-existing repository-wide type debt (informational)
        continue-on-error: true
        run: npx tsc --noEmit --pretty false
      - name: Production build smoke check
        run: npm run build
