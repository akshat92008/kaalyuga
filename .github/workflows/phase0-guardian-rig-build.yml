name: "P0 Kala-Bhairava reconstructed rig preview"
on:
  push:
    branches:
      - feature/phase1-weapon-socket-combat-proof-20261122
    paths:
      - scripts/qa/rig_kalabhairava.py
      - .github/workflows/phase0-guardian-rig-build.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-guardian-rig-build
  cancel-in-progress: true
jobs:
  rig-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch original guardian model and Mixamo source clips without altering originals
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/qa/rig_kalabhairava.py
            new 3D assets and animations/3D Models/Horned_Warlord_of_the_Abyss/Meshy_AI_Horned_Warlord_of_the_Abyss_20261120_generate.fbx
            new 3D assets and animations/Animations/Creature Pack (4)/mutant breathing idle.fbx
            new 3D assets and animations/Animations/Pro Melee Axe Pack (5)/standing melee attack downward.fbx
      - name: Install Blender for real skinning and FBX export
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Build skin-bound 3D candidate and actual Blender pose screenshots
        run: |
          blender -b -t 2 --python scripts/qa/rig_kalabhairava.py -- \
            --mesh "new 3D assets and animations/3D Models/Horned_Warlord_of_the_Abyss/Meshy_AI_Horned_Warlord_of_the_Abyss_20261120_generate.fbx" \
            --idle "new 3D assets and animations/Animations/Creature Pack (4)/mutant breathing idle.fbx" \
            --heavy "new 3D assets and animations/Animations/Pro Melee Axe Pack (5)/standing melee attack downward.fbx" \
            --output build/guardian
      - name: Publish new candidate only as an artifact pending visual approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kala-bhairava-skinning-candidate-and-pose-previews
          path: build/guardian
          if-no-files-found: warn
          retention-days: 14
